<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gastos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#0A0A0A">

<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjggMTI4Ij48cmVjdCB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgcng9IjI4IiBmaWxsPSIjMEEwQTBBIi8+PHRleHQgeD0iNjQiIHk9IjgwIiBmb250LWZhbWlseT0iYXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjcwMCIgZm9udC1zaXplPSI1NiIgZmlsbD0iI0Y1RjVGNSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+UiQ8L3RleHQ+PC9zdmc+">

<style>
  :root{
    --bg:#0A0A0A; --panel:#161616; --panel-2:#1F1F1F; --line:#2A2A2A;
    --text:#F5F5F5; --text-dim:#9A9A9A; --text-faint:#5C5C5C;
    --investimento:#8BD450;
    --danger:#E5484D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .font-mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  header{ padding:24px 20px 16px; text-align:center; }
  header h1{ font-size:15px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin:0; }

  /* ===== NAVEGADOR DE MÊS ===== */
  .month-nav{
    display:flex; align-items:center; justify-content:center; gap:4px;
    max-width:520px; margin:0 auto; padding:0 16px 16px;
  }
  .month-nav-inner{
    display:flex; align-items:center; gap:6px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:6px 8px;
  }
  .month-nav-arrow{
    width:34px; height:34px; border-radius:10px; border:none; background:var(--panel-2);
    color:var(--text-dim); font-size:16px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:all .15s ease; flex-shrink:0;
  }
  .month-nav-arrow:active{ transform:scale(0.92); }
  .month-nav-label{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    color:var(--text); padding:0 10px; min-width:150px; text-align:center;
    cursor:pointer; background:none; border:none; user-select:none;
  }
  .month-nav-today{
    font-size:11px; font-weight:700; color:var(--text-faint); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
    transition:all .15s ease; white-space:nowrap; margin-left:6px;
  }
  .month-nav-today:active{ transform:scale(0.95); }
  #monthPicker{
    position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;
  }

  /* ===== RESUMO ===== */
  .summary{ padding:0 16px 20px; max-width:520px; margin:0 auto; }
  .total-geral{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:22px 20px 18px; text-align:center; margin-bottom:12px;
  }
  .total-geral .label{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .total-geral .value{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:38px; }
  .total-geral .invest-line{ margin-top:10px; font-size:12.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .total-geral .invest-line b{ color:var(--investimento); }

  .sub-totals{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sub-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:13px 15px; }
  .sub-card .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--c); }
  .sub-card .value{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--c); }

  .mes-total{ margin-top:10px; text-align:center; font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .mes-total b{ color:var(--text); }

  /* ===== FORM ===== */
  .form-wrap{ padding:4px 16px 20px; max-width:520px; margin:0 auto; }
  form{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; }
  .field input[type="text"], .field input[type="number"]{
    width:100%; padding:14px 14px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:12px; color:var(--text); font-size:17px; font-family:'JetBrains Mono',monospace;
  }
  .field input:focus{ outline:none; border-color:var(--text-dim); }
  .field input#fMotivo{ font-family:'Inter',sans-serif; font-size:16px; }

  .toggle-group{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .toggle-btn{
    grid-column:span 2; padding:14px 6px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); font-weight:700; font-size:13px;
    cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .toggle-btn.wide{ grid-column:span 3; }
  .toggle-btn.active{ background:var(--cd); border-color:var(--c); color:var(--c); }

  .add-btn{
    width:100%; margin-top:6px; padding:16px; border:none; border-radius:12px;
    background:var(--text); color:var(--bg); font-weight:700; font-size:15px;
    cursor:pointer; transition:transform .1s ease, opacity .15s ease;
  }
  .add-btn:active{ transform:scale(0.98); }
  .form-error{ font-size:12px; color:var(--danger); margin-top:10px; display:none; text-align:center; }

  /* ===== FILTRO ===== */
  .filters{ display:flex; gap:8px; padding:4px 16px 14px; max-width:520px; margin:0 auto; overflow-x:auto; scrollbar-width:none; }
  .filters::-webkit-scrollbar{ display:none; }
  .filter-btn{
    flex:0 0 auto; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  .filter-btn.active{ background:var(--panel-2); color:var(--text); border-color:var(--text-faint); }

  /* ===== LISTA ===== */
  .entries{ padding:0 16px; max-width:520px; margin:0 auto; }
  .entry{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
  }
  .entry .left{ min-width:0; flex:1; }
  .entry .top-row{ display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  .entry .badge{ font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:0.04em; text-transform:uppercase; background:var(--cd); color:var(--c); }
  .entry .motivo{ font-weight:600; font-size:14.5px; word-break:break-word; }
  .entry .data{ font-size:11.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; margin-top:3px; }
  .entry .right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .entry .valor{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; }
  .entry .del{
    background:var(--panel-2); border:none; color:var(--text-faint); width:28px; height:28px;
    border-radius:8px; cursor:pointer; font-size:14px; transition:all .15s ease;
  }
  .entry .del:hover, .entry .del.confirming{ background:var(--danger); color:#fff; }

  .empty{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:13px; line-height:1.6; }
  .pdf-wrap{ padding:24px 16px 40px; max-width:520px; margin:0 auto; }
  .pdf-btn{ width:100%; padding:15px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-weight:700; font-size:15px; cursor:pointer; }
  .pdf-btn:active{ transform:scale(0.98); }
  .pdf-msg{ text-align:center; font-size:12px; color:var(--text-dim); margin-top:8px; min-height:16px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header><h1>Controle de Gastos</h1></header>

<div class="month-nav">
  <div class="month-nav-inner">
    <button class="month-nav-arrow" id="prevMonthBtn" aria-label="Mês anterior">‹</button>
    <button class="month-nav-label" id="monthLabel"></button>
    <button class="month-nav-arrow" id="nextMonthBtn" aria-label="Próximo mês">›</button>
  </div>
  <button class="month-nav-today" id="todayBtn" style="display:none;">Hoje</button>
  <input type="month" id="monthPicker">
</div>

<div class="summary">
  <div class="total-geral">
    <div class="label">Gasto do mês</div>
    <div class="value font-mono" id="totalGasto">R$ 0,00</div>
    <div class="invest-line">Investido: <b id="totalInvest">R$ 0,00</b></div>
  </div>
  <div class="sub-totals" id="subTotals"></div>
  <div class="mes-total" id="hojeRow">Gasto hoje: <b id="totalHoje">R$ 0,00</b></div>
</div>

<div class="form-wrap">
  <form id="gastoForm">
    <div class="field">
      <label>Valor (R$)</label>
      <input id="fValor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
    </div>
    <div class="field">
      <label>Motivo</label>
      <input id="fMotivo" type="text" placeholder="Ex: almoço, gasolina, mercado..." required>
    </div>
    <div class="field">
      <label>Tipo</label>
      <div class="toggle-group" id="toggleGroup"></div>
    </div>
    <button type="submit" class="add-btn">Adicionar</button>
    <p class="form-error" id="formError"></p>
  </form>
</div>

<div class="filters" id="filters"></div>

<div class="entries" id="entriesList"></div>

<div class="pdf-wrap">
  <button type="button" class="pdf-btn" id="pdfBtn">Gerar extrato PDF do mês</button>
  <p class="pdf-msg" id="pdfMsg"></p>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "gastos-pessoais-v2";
  const MIGRACAO_KEY = "gastos-migracao-5tipos";
  const BACKUP_KEY = "gastos-pessoais-v2-backup-antes-5tipos";

  /* tipos: ordem = ordem dos botões. pdf = cor no PDF (impressão) */
  const TIPOS = {
    contas:         { nome:"Contas",         cor:"#6EA8FE", dim:"#1A2A44", pdf:[52,110,200] },
    essencial:      { nome:"Essencial",      cor:"#3DD9C4", dim:"#1D3B37", pdf:[29,140,126] },
    investimento:   { nome:"Investimento",   cor:"#8BD450", dim:"#24361A", pdf:[70,140,40] },
    relacionamento: { nome:"Relacionamento", cor:"#F472B6", dim:"#3D1A2E", pdf:[200,70,140] },
    futil:          { nome:"Fútil",          cor:"#F5A623", dim:"#3D2E10", pdf:[196,124,8] }
  };
  const TIPOS_GASTO = ["contas","essencial","relacionamento","futil"];
  const ehGasto = (g)=> g.tipo !== "investimento";
  const corVars = (t)=> `--c:${(TIPOS[t]||TIPOS.futil).cor};--cd:${(TIPOS[t]||TIPOS.futil).dim}`;
  const esc = (t)=> String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let GASTOS = [];
  let tipoSelecionado = null;
  let filtroAtivo = "todos";

  const hoje = new Date();
  let anoSelecionado = hoje.getFullYear();
  let mesSelecionado = hoje.getMonth();

  const fmt = (n)=> n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const fmtData = (iso)=> new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}) + " às " + new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const soma = (l)=> l.reduce((s,g)=> s + g.valor, 0);
  const $ = (id)=> document.getElementById(id);

  const monthLabel = $("monthLabel"), monthPicker = $("monthPicker"), todayBtn = $("todayBtn");
  const entriesList = $("entriesList"), form = $("gastoForm"), formError = $("formError");

  /* ===== dados ===== */
  function loadGastos(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      GASTOS = raw ? JSON.parse(raw) : [];
    }catch(e){ console.error("Erro ao carregar dados:", e); GASTOS = []; }
  }
  function saveGastos(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(GASTOS)); return true; }
    catch(e){ console.error("Erro ao salvar:", e); return false; }
  }

  /* ===== reclassificação única dos lançamentos antigos (obrigatório/fútil) ===== */
  function normaliza(t){ return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }
  function novoTipo(g){
    const m = normaliza(g.motivo);
    if(m.includes("giulia") || m === "rosa" || m === "cacau show" || m === "gamboa") return "relacionamento";
    if(m === "conta pai" || m === "hcc" || m.includes("spotify") || m === "apple") return "contas";
    if(m.includes("caixinha") || m.includes("investimento") || /\bxp\b/.test(m)) return "investimento";
    return g.tipo === "obrigatorio" ? "essencial" : "futil";
  }
  function migrar(){
    try{
      if(localStorage.getItem(MIGRACAO_KEY)) return;
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw && !localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw);
      let mudou = false;
      GASTOS.forEach(g=>{
        if(g.tipo === "obrigatorio" || g.tipo === "futil" || !TIPOS[g.tipo]){
          const t = novoTipo(g);
          if(t !== g.tipo){ g.tipo = t; mudou = true; }
        }
      });
      if(mudou && !saveGastos()) return;
      localStorage.setItem(MIGRACAO_KEY, "1");
    }catch(e){ console.error("Erro na reclassificação:", e); }
  }

  /* ===== monta botões, cards e filtros a partir de TIPOS ===== */
  const ordemBotoes = Object.keys(TIPOS);
  $("toggleGroup").innerHTML = ordemBotoes.map((t,i)=>
    `<button type="button" class="toggle-btn${i>2?" wide":""}" data-tipo="${t}" style="${corVars(t)}">${TIPOS[t].nome}</button>`
  ).join("");
  $("subTotals").innerHTML = TIPOS_GASTO.map(t=>
    `<div class="sub-card" style="${corVars(t)}"><div class="label"><span class="dot"></span>${TIPOS[t].nome}</div><div class="value" id="tot-${t}">R$ 0,00</div></div>`
  ).join("");
  $("filters").innerHTML = `<button class="filter-btn active" data-filter="todos">Todos</button>` +
    ordemBotoes.map(t=> `<button class="filter-btn" data-filter="${t}">${TIPOS[t].nome}</button>`).join("");

  document.querySelectorAll(".toggle-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      tipoSelecionado = btn.dataset.tipo;
      document.querySelectorAll(".toggle-btn").forEach(b=> b.classList.toggle("active", b === btn));
    });
  });
  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      filtroAtivo = btn.dataset.filter;
      render();
    });
  });

  /* ===== navegador de mês ===== */
  const NOMES_MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const nomeMesAtual = ()=> NOMES_MES[mesSelecionado].charAt(0).toUpperCase() + NOMES_MES[mesSelecionado].slice(1) + " de " + anoSelecionado;

  function atualizarMonthNav(){
    monthLabel.textContent = nomeMesAtual();
    const ehMesAtual = anoSelecionado === hoje.getFullYear() && mesSelecionado === hoje.getMonth();
    todayBtn.style.display = ehMesAtual ? "none" : "block";
    $("hojeRow").style.display = ehMesAtual ? "block" : "none";
    monthPicker.value = anoSelecionado + "-" + String(mesSelecionado + 1).padStart(2, "0");
  }
  function irParaMes(ano, mes){ anoSelecionado = ano; mesSelecionado = mes; atualizarMonthNav(); render(); }

  $("prevMonthBtn").addEventListener("click", ()=>{
    mesSelecionado--; if(mesSelecionado < 0){ mesSelecionado = 11; anoSelecionado--; }
    irParaMes(anoSelecionado, mesSelecionado);
  });
  $("nextMonthBtn").addEventListener("click", ()=>{
    mesSelecionado++; if(mesSelecionado > 11){ mesSelecionado = 0; anoSelecionado++; }
    irParaMes(anoSelecionado, mesSelecionado);
  });
  todayBtn.addEventListener("click", ()=> irParaMes(hoje.getFullYear(), hoje.getMonth()));
  monthLabel.addEventListener("click", ()=>{ if(monthPicker.showPicker){ monthPicker.showPicker(); } else { monthPicker.click(); } });
  monthPicker.addEventListener("change", ()=>{
    if(!monthPicker.value) return;
    const [ano, mes] = monthPicker.value.split("-").map(Number);
    irParaMes(ano, mes - 1);
  });

  const doMesSelecionado = ()=> GASTOS.filter(g=>{
    const d = new Date(g.data);
    return d.getFullYear() === anoSelecionado && d.getMonth() === mesSelecionado;
  });

  /* ===== render ===== */
  function render(){
    const doMes = doMesSelecionado();
    const gastos = doMes.filter(ehGasto);
    $("totalGasto").textContent = fmt(soma(gastos));
    $("totalInvest").textContent = fmt(soma(doMes.filter(g=>g.tipo==="investimento")));
    TIPOS_GASTO.forEach(t=> $("tot-"+t).textContent = fmt(soma(doMes.filter(g=>g.tipo===t))));
    $("totalHoje").textContent = fmt(soma(gastos.filter(g=> new Date(g.data).toDateString() === hoje.toDateString())));

    let lista = [...doMes].sort((a,b)=> new Date(b.data) - new Date(a.data));
    if(filtroAtivo !== "todos") lista = lista.filter(g => g.tipo === filtroAtivo);

    if(lista.length === 0){
      entriesList.innerHTML = `<div class="empty">${doMes.length===0 ? "Nenhum lançamento neste mês." : "Nenhum lançamento nesse filtro, neste mês."}</div>`;
      return;
    }

    entriesList.innerHTML = lista.map(g => `
      <div class="entry">
        <div class="left">
          <div class="top-row"><span class="badge" style="${corVars(g.tipo)}">${(TIPOS[g.tipo]||{nome:g.tipo}).nome}</span></div>
          <div class="motivo">${esc(g.motivo)}</div>
          <div class="data">${fmtData(g.data)}</div>
        </div>
        <div class="right">
          <span class="valor">${fmt(g.valor)}</span>
          <button class="del" data-id="${g.id}">✕</button>
        </div>
      </div>`).join("");

    entriesList.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(btn.dataset.confirm !== "1"){
          btn.dataset.confirm = "1"; btn.classList.add("confirming");
          setTimeout(()=>{ btn.dataset.confirm = "0"; btn.classList.remove("confirming"); }, 2500);
          return;
        }
        GASTOS = GASTOS.filter(g => g.id !== btn.dataset.id);
        saveGastos(); render();
      });
    });
  }

  /* ===== adicionar ===== */
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    formError.style.display = "none";
    const valor = parseFloat($("fValor").value);
    const motivo = $("fMotivo").value.trim();
    if(isNaN(valor) || valor <= 0 || !motivo || !tipoSelecionado){
      formError.textContent = !tipoSelecionado ? "Escolhe o tipo do lançamento." : "Preenche o valor e o motivo antes de adicionar.";
      formError.style.display = "block";
      return;
    }
    GASTOS.push({ id: "g" + Date.now() + Math.random().toString(36).slice(2,7), valor, motivo, tipo: tipoSelecionado, data: new Date().toISOString() });
    if(!saveGastos()){
      formError.textContent = "Não consegui salvar. O celular pode estar sem espaço de armazenamento.";
      formError.style.display = "block";
      GASTOS.pop();
      return;
    }
    form.reset();
    tipoSelecionado = null;
    document.querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
    $("fValor").focus();
    irParaMes(hoje.getFullYear(), hoje.getMonth());
  });

  /* ===== extrato PDF ===== */
  const pdfMsg = $("pdfMsg");
  const brl = (n)=> fmt(n).replace(/\u00a0/g, " ");
  const limpa = (t)=> String(t).replace(/[^\u0000-\u00ff\u2013\u2014]/g, "").trim() || "-";

  function gerarExtratoPDF(){
    if(!window.jspdf || !window.jspdf.jsPDF){
      pdfMsg.textContent = "Não consegui carregar o gerador de PDF. Confira a internet e tente de novo.";
      return;
    }
    const doMes = doMesSelecionado().sort((a,b)=> new Date(a.data) - new Date(b.data));
    if(doMes.length === 0){ pdfMsg.textContent = "Nenhum lançamento neste mês para gerar o extrato."; return; }

    const gastos = doMes.filter(ehGasto);
    const invest = doMes.filter(g=>g.tipo==="investimento");
    const totGasto = soma(gastos), totInvest = soma(invest);
    const pct = (v)=> totGasto ? (v/totGasto*100).toFixed(1).replace(".", ",") + "%" : "-";
    const nomeMes = nomeMesAtual();
    const diasNoMes = new Date(anoSelecionado, mesSelecionado + 1, 0).getDate();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"mm", format:"a4" });
    const W = doc.internal.pageSize.getWidth(), M = 15;
    const DARK = [30,30,30], GREY = [110,110,110];

    doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...DARK);
    doc.text("Extrato de gastos", M, 20);
    doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.setTextColor(...GREY);
    doc.text(nomeMes, M, 27);
    doc.setFontSize(9);
    doc.text("Gerado em " + new Date().toLocaleDateString("pt-BR") + " às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}), W - M, 20, { align:"right" });

    const linhasResumo = TIPOS_GASTO.map(t=>{
      const l = doMes.filter(g=>g.tipo===t);
      return [TIPOS[t].nome + " (" + l.length + ")", brl(soma(l)), pct(soma(l))];
    });
    linhasResumo.push(["Gasto do mês (" + gastos.length + " lançamentos)", brl(totGasto), totGasto ? "100%" : "-"]);
    linhasResumo.push(["Média de gasto por dia (" + diasNoMes + " dias)", brl(totGasto / diasNoMes), ""]);
    if(gastos.length){
      const maior = gastos.reduce((m,g)=> g.valor > m.valor ? g : m, gastos[0]);
      linhasResumo.push(["Maior gasto: " + limpa(maior.motivo), brl(maior.valor), pct(maior.valor)]);
    }
    linhasResumo.push(["Investido no mês (" + invest.length + ")", brl(totInvest), "fora do gasto"]);
    const iTotal = TIPOS_GASTO.length, iInvest = linhasResumo.length - 1;

    doc.autoTable({
      startY: 34,
      head: [["Resumo do mês", "Valor", "% do gasto"]],
      body: linhasResumo,
      theme: "grid",
      headStyles: { fillColor: DARK, textColor: 255, fontStyle:"bold" },
      columnStyles: { 1:{ halign:"right", cellWidth:35 }, 2:{ halign:"right", cellWidth:28 } },
      styles: { fontSize:10, cellPadding:2.5 },
      didParseCell: (d)=>{
        if(d.section === "head" && d.column.index > 0) d.cell.styles.halign = "right";
        if(d.section !== "body") return;
        if(d.row.index < iTotal && d.column.index === 0) d.cell.styles.textColor = TIPOS[TIPOS_GASTO[d.row.index]].pdf;
        if(d.row.index === iTotal) d.cell.styles.fontStyle = "bold";
        if(d.row.index === iInvest){ d.cell.styles.textColor = TIPOS.investimento.pdf; d.cell.styles.fontStyle = "bold"; }
      },
      margin: { left:M, right:M }
    });

    function secao(t){
      const lista = doMes.filter(g=>g.tipo===t);
      if(!lista.length) return;
      const sub = soma(lista), cor = TIPOS[t].pdf;
      let y = doc.lastAutoTable.finalY + 10;
      if(y > 260){ doc.addPage(); y = 20; }
      doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...cor);
      doc.text(TIPOS[t].nome, M, y);
      doc.autoTable({
        startY: y + 3,
        head: [["#", "Data", "Motivo", "Valor"]],
        body: lista.map((g,i)=> [String(i+1), new Date(g.data).toLocaleDateString("pt-BR"), limpa(g.motivo), brl(g.valor)]),
        foot: [["", "", t === "investimento" ? "Total investido" : "Subtotal (" + pct(sub) + " do gasto)", brl(sub)]],
        theme: "striped",
        headStyles: { fillColor: cor, textColor: 255 },
        footStyles: { fillColor: [240,240,240], textColor: DARK, fontStyle:"bold" },
        columnStyles: { 0:{ cellWidth:10, textColor:GREY }, 1:{ cellWidth:26 }, 3:{ halign:"right", cellWidth:32 } },
        styles: { fontSize:9.5, cellPadding:2.2 },
        showFoot: "lastPage",
        didParseCell: (d)=>{ if(d.column.index === 3 && d.section !== "body") d.cell.styles.halign = "right"; },
        margin: { left:M, right:M }
      });
    }
    TIPOS_GASTO.forEach(secao);
    secao("investimento");

    let y = doc.lastAutoTable.finalY + 10;
    if(y > 262){ doc.addPage(); y = 20; }
    doc.setDrawColor(...DARK); doc.setLineWidth(0.5); doc.line(M, y - 5, W - M, y - 5);
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...DARK);
    doc.text("Gasto do mês", M, y + 1);
    doc.text(brl(totGasto), W - M, y + 1, { align:"right" });
    doc.setFontSize(11); doc.setTextColor(...TIPOS.investimento.pdf);
    doc.text("Investido no mês", M, y + 8);
    doc.text(brl(totInvest), W - M, y + 8, { align:"right" });
    doc.setTextColor(...GREY); doc.setFont("helvetica","normal");
    doc.text("Total que saiu da conta", M, y + 15);
    doc.text(brl(totGasto + totInvest), W - M, y + 15, { align:"right" });

    const n = doc.getNumberOfPages();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...GREY);
      doc.text("Controle de Gastos — " + nomeMes, M, 290);
      doc.text("Página " + i + " de " + n, W - M, 290, { align:"right" });
    }
    doc.save("extrato-gastos-" + anoSelecionado + "-" + String(mesSelecionado + 1).padStart(2, "0") + ".pdf");
    pdfMsg.textContent = "Extrato de " + nomeMes + " gerado.";
    setTimeout(()=>{ pdfMsg.textContent = ""; }, 5000);
  }
  $("pdfBtn").addEventListener("click", gerarExtratoPDF);

  loadGastos();
  migrar();
  atualizarMonthNav();
  render();
})();
</script>
</body>
</html>
